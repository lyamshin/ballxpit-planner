    <clipPath id="r"><rect x="32" y="0" width="32" height="64"/></clipPath>
  </defs>
  <rect width="64" height="64" rx="14" fill="#0b0e14"/>
  <circle cx="32" cy="32" r="19" fill="#38bdf8" clip-path="url(#l)"/>
  <circle cx="32" cy="32" r="19" fill="#f472b6" clip-path="url(#r)"/>
  <circle cx="32" cy="32" r="19" fill="none" stroke="#0b0e14" stroke-width="3"/>
  <path d="M32 8 L32 56" stroke="#0b0e14" stroke-width="4"/>
  <circle cx="32" cy="32" r="6" fill="#fbbf24"/>
